CONFIG_ZMK_KEYBOARD_NAME="PiparFlake"
CONFIG_USB_DEVICE_MANUFACTURER="koit.dev"
CONFIG_USB_DEVICE_VID=0x1d50
CONFIG_USB_DEVICE_PID=0x6170
CONFIG_ZMK_VIA=y
CONFIG_ZMK_VIA_ENCODER=y
CONFIG_ZMK_VIA_MACRO=y
CONFIG_ZMK_VIA_CUSTOM_KEYCODES=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
CONFIG_ZMK_KEYMAP_SETTINGS_STORAGE=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_Z_VDB_SIZE=32
# Custom status screens do not inherit the built-in screen's larger heap.
# Reserve room for the screen, four styled labels, their text, and timers.
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_LV_USE_LABEL=y
CONFIG_ZMK_KEYMAP_LAYER_REORDERING=y
