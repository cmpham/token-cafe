[package]
name = "cafe-board-engine"
version = "0.1.0"
edition = "2024"
[workspace]
[lib]
crate-type = ["staticlib"]
[dependencies]
cafe-ui = { path = "../../crates/cafe-ui", default-features = false }
companion-core = { path = "../../crates/companion-core", default-features = false }
[profile.release]
panic = "abort"
opt-level = 3
lto = "thin"
