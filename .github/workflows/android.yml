name: Android
on:
  push:
    paths: ['android/**', 'assets/app-icon.png', 'crates/android-client/**', 'crates/cafe-ui/**', 'tools/build_android.sh', 'tools/verify_android_apk.py', 'Cargo.toml', 'Cargo.lock', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'assets/app-icon.png', 'crates/android-client/**', 'crates/cafe-ui/**', 'tools/build_android.sh', 'tools/verify_android_apk.py', 'Cargo.toml', 'Cargo.lock', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - uses: android-actions/setup-android@v3
      - name: Install native build tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
          cargo install cargo-ndk --version 4.1.2 --locked
      - run: cargo test -p token-cafe-android --locked
      - run: ./tools/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: token-cafe-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
